# Настройки одиночного сервера для измерений. Подключаются из postgresql.conf через include.
listen_addresses = '127.0.0.1'
unix_socket_directories = '/tmp'   # каталог /var/run/postgresql обычному пользователю недоступен
shared_buffers = 256MB
work_mem = 16MB
effective_cache_size = 1GB
maintenance_work_mem = 128MB
jit = off                        # компиляция запросов только добавила бы шум в короткие запросы
max_parallel_workers_per_gather = 2
random_page_cost = 1.1           # база лежит на SSD
log_min_messages = warning
log_line_prefix = '%m [%p] %q%u@%d '
